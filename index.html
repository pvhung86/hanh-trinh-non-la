<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; connect-src 'self' data:;">
    <title>Nón lá Adventure - Học Tiếng Việt Vui Nhộn</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --wood-dark: #8B5A2B;
            --wood-light: #DEB887;
            --text-dark: #2C3E50;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #74b9ff, #a0e3f9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 1280px;
            height: 720px;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 60%, #90EE90 100%);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border-radius: 16px;
            overflow: hidden;
        }

        /* Canvas Layer */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Wood UI Panels */
        .wood-panel {
            background: linear-gradient(180deg, var(--wood-light), var(--wood-dark));
            border: 4px solid #5C3A21;
            border-radius: 20px;
            box-shadow: 0 6px 0 #3a2313, 0 10px 20px rgba(0,0,0,0.3);
            color: var(--white);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        /* Top HUD */
        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hud-top > * {
            pointer-events: auto;
        }

        .logo-panel {
            font-size: 22px;
            background: linear-gradient(180deg, #f39c12, #d35400);
            border-color: #933e08;
            box-shadow: 0 6px 0 #5c2705, 0 10px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .phrase-panel {
            background: #FFF8E7;
            border: 4px solid #DEB887;
            border-radius: 24px;
            padding: 12px 28px;
            color: var(--text-dark);
            font-size: 26px;
            box-shadow: 0 6px 0 #c2a178, 0 10px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 15px;
            max-width: 600px;
            text-align: center;
            text-shadow: none;
        }

        .phrase-panel .speaker-icon {
            cursor: pointer;
            font-size: 32px;
            transition: transform 0.2s;
        }

        .phrase-panel .speaker-icon:hover {
            transform: scale(1.15);
        }

        .right-hud {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .level-panel {
            font-size: 18px;
            padding: 12px 20px;
        }

        .score-panel {
            font-size: 18px;
            padding: 12px 20px;
            background: linear-gradient(180deg, #27ae60, #1e8449);
            border-color: #145a32;
            box-shadow: 0 6px 0 #0b3b1c, 0 10px 20px rgba(0,0,0,0.3);
        }

        /* Central Mic & Status */
        .center-hud {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 30px;
            border-radius: 30px;
            border: 3px solid #DEB887;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .asr-label {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #7f8c8d;
            text-transform: uppercase;
        }

        .asr-transcript {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
            min-height: 28px;
        }

        .feedback-msg {
            font-size: 15px;
            font-weight: bold;
            color: #e74c3c;
            min-height: 20px;
        }

        /* Guide Girl Companion (Bottom Left) */
        .guide-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            z-index: 10;
            pointer-events: none;
        }

        .guide-avatar {
            width: 100px;
            height: 100px;
            background: #ffcccc;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            flex-shrink: 0;
        }

        .guide-speech {
            background: #FFF8E7;
            border: 3px solid #DEB887;
            border-radius: 20px;
            padding: 10px 18px;
            color: var(--text-dark);
            font-size: 15px;
            font-weight: bold;
            max-width: 300px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            position: relative;
            margin-bottom: 15px;
        }

        .guide-speech::after {
            content: '';
            position: absolute;
            left: -12px;
            bottom: 15px;
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-right: 12px solid #DEB887;
        }

        /* Modals & Overlays */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-card {
            background: linear-gradient(180deg, #FFF8E7, #F5DEB3);
            border: 6px solid #8B5A2B;
            border-radius: 28px;
            padding: 40px;
            width: 600px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .modal-card h1 {
            color: #d35400;
            font-size: 38px;
            text-shadow: 2px 2px 0 #fff;
        }

        .modal-card p {
            color: #2c3e50;
            font-size: 18px;
            line-height: 1.5;
        }

        .btn-primary {
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            border: 4px solid #145a32;
            border-radius: 25px;
            padding: 12px 35px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #0b3b1c, 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0b3b1c;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Background & Game Entities -->
        <canvas id="gameCanvas" width="1280" height="720"></canvas>

        <!-- Top HUD -->
        <div class="hud-top">
            <div class="wood-panel logo-panel">
                <span>🇻🇳</span> Nón Lá Adventure
            </div>
            <div class="phrase-panel" id="phrasePanel">
                <span class="speaker-icon" id="speakerBtn" title="Nghe đọc">🔊</span>
                <span id="targetPhraseText">Đang tải...</span>
            </div>
            <div class="right-hud">
                <div class="wood-panel score-panel" id="scoreDisplay">⭐ 0000</div>
                <div class="wood-panel level-panel" id="levelIndicator">Cấp 1 / 100</div>
            </div>
        </div>

        <!-- Central Mic & Status HUD -->
        <div class="center-hud">
            <div class="asr-label">🎙️ Máy đang nghe (Hãy phát âm cụm từ trên)</div>
            <div class="asr-transcript" id="asrTranscriptText">...</div>
            <div class="feedback-msg" id="feedbackMsg"></div>
        </div>

        <!-- Bottom-Left Guide Girl -->
        <div class="guide-container">
            <div class="guide-avatar">👧🏻</div>
            <div class="guide-speech" id="guideSpeech">
                Phát âm chuẩn xác để giúp Nón Lá vượt qua chướng ngại vật nhé!
            </div>
        </div>

        <!-- Level Complete Modal -->
        <div class="modal-overlay hidden" id="levelCompleteModal">
            <div class="modal-card">
                <h1 id="modalTitle">🎉 Hoàn thành Cấp độ!</h1>
                <p id="modalDesc" style="font-size: 20px; color: #535353;">Bé đã vượt qua 5 từ vựng xuất sắc!</p>
                <button class="btn-primary" id="nextLevelBtn">CẤP ĐỘ TIẾP THEO</button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
         * ROBUST STORAGE WRAPPER
         * ========================================================================== */
        const Storage = {
            get(key, defaultValue) {
                try {
                    const val = localStorage.getItem(key);
                    return val !== null ? JSON.parse(val) : defaultValue;
                } catch (e) {
                    console.warn(`Storage get error for key "${key}":`, e);
                    return defaultValue;
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                } catch (e) {
                    console.warn(`Storage set error for key "${key}":`, e);
                }
            }
        };
